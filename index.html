<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Fact Lab PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary: #4A90E2;
            --success: #2ECC71;
            --error: #E74C3C;
            --dark: #2C3E50;
            --light: #F8F9FA;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; background: var(--light); color: var(--dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { background: var(--primary); color: white; width: 100%; text-align: center; padding: 15px; font-size: 1.5rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .container { width: 100%; max-width: 500px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: auto; margin-bottom: auto; }
        .score-board { display: flex; justify-content: space-between; width: 100%; font-size: 1.1rem; font-weight: 600; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; width: 100%; justify-content: center; }
        .op-btn { border: 2px solid var(--primary); background: transparent; color: var(--primary); padding: 8px 15px; border-radius: 20px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .op-btn.active { background: var(--primary); color: white; }
        .card { background: white; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); width: 100%; padding: 40px 20px; text-align: center; border: 2px solid #EAEAEA; }
        .problem { font-size: 4rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; }
        .input-area { display: flex; width: 100%; gap: 10px; }
        input[type="number"] { flex: 1; font-size: 2rem; padding: 10px; border: 2px solid #BDC3C7; border-radius: 10px; text-align: center; -webkit-appearance: none; margin: 0; }
        input[type="number"]:focus { border-color: var(--primary); outline: none; }
        .submit-btn { background: var(--primary); color: white; border: none; font-size: 1.5rem; font-weight: bold; padding: 0 25px; border-radius: 10px; cursor: pointer; }
        .feedback { font-size: 1.3rem; font-weight: bold; min-height: 30px; transition: 0.2s; }
        .feedback.correct { color: var(--success); }
        .feedback.wrong { color: var(--error); }
    </style>
</head>
<body>

    <header>📐 Math Fact Lab</header>
    
    <div class="container">
        <div class="score-board">
            <div>Score: <span id="score">0</span></div>
            <div>Streak: <span id="streak">0</span> 🔥</div>
        </div>

        <div class="controls">
            <button class="op-btn active" onclick="setOperation('+')">+</button>
            <button class="op-btn" onclick="setOperation('-')">-</button>
            <button class="op-btn" onclick="setOperation('×')">×</button>
            <button class="op-btn" onclick="setOperation('÷')">÷</button>
        </div>

        <div class="card">
            <div class="problem" id="question">--</div>
            <div class="feedback" id="feedback"></div>
        </div>

        <form class="input-area" id="math-form" onsubmit="checkAnswer(event)">
            <input type="number" id="answer" pattern="[0-9]*" inputmode="numeric" placeholder="?" required autocomplete="off">
            <button type="submit" class="submit-btn">Go</button>
        </form>
    </div>

    <script>
        let currentOp = '+';
        let num1, num2, correctAnswer;
        let score = 0;
        let streak = 0;

        function generateProblem() {
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback';
            feedback.innerText = '';
            document.getElementById('answer').value = '';
            document.getElementById('answer').focus();

            let maxNum = currentOp === '×' || currentOp === '÷' ? 12 : 20;
            num1 = Math.floor(Math.random() * maxNum) + 1;
            num2 = Math.floor(Math.random() * maxNum) + 1;

            if (currentOp === '+') {
                correctAnswer = num1 + num2;
                document.getElementById('question').innerText = `${num1} + ${num2}`;
            } else if (currentOp === '-') {
                if (num1 < num2) [num1, num2] = [num2, num1]; // Keep positive results
                correctAnswer = num1 - num2;
                document.getElementById('question').innerText = `${num1} - ${num2}`;
            } else if (currentOp === '×') {
                correctAnswer = num1 * num2;
                document.getElementById('question').innerText = `${num1} × ${num2}`;
            } else if (currentOp === '÷') {
                let product = num1 * num2; // Working backward ensures clean whole-number answers
                correctAnswer = num1;
                document.getElementById('question').innerText = `${product} ÷ ${num2}`;
            }
        }

        function setOperation(op) {
            currentOp = op;
            document.querySelectorAll('.op-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === op);
            });
            generateProblem();
        }

        function checkAnswer(e) {
            e.preventDefault();
            const userAnswer = parseInt(document.getElementById('answer').value);
            const feedback = document.getElementById('feedback');

            if (userAnswer === correctAnswer) {
                feedback.innerText = "Correct! 🎉";
                feedback.className = "feedback correct";
                score += 10;
                streak++;
            } else {
                feedback.innerText = `Oops! Correct answer was ${correctAnswer}.`;
                feedback.className = "feedback wrong";
                streak = 0;
            }

            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;
            
            setTimeout(generateProblem, 1500);
        }

        // Register Service Worker for PWA capabilities
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('Service Worker Registration Failed:', err));
            });
        }

        // Start initial challenge
        generateProblem();
    </script>
</body>
</html>
